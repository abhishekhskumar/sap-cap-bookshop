_schema-version: '3.1'
ID: my-cap-app
version: 1.0.0
description: Invoice Tax Intelligence — CAP service with Fiori UI5 frontend

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:

  # ── CAP Node.js service ────────────────────────────────────────────────────
  - name: my-cap-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: my-cap-app-auth

  # ── Approuter ──────────────────────────────────────────────────────────────
  - name: my-cap-app-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: my-cap-app-auth
      - name: my-cap-app-html5-repo-runtime

  # ── Fiori UI5 app ──────────────────────────────────────────────────────────
  - name: intelligence-ui5
    type: html5
    path: app/intelligence-ui5
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

resources:

  - name: my-cap-app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      config:
        xsappname: my-cap-app
        tenant-mode: dedicated

  - name: my-cap-app-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
